# Portão de validação (padrão Sebratel): o deploy é o Portainer buildando do Git.
# Só o check "ci-ok" é obrigatório na proteção da main.
name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

# Menor privilégio: o CI só lê o repositório.
permissions:
  contents: read

# Push novo cancela o run anterior da mesma branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validacoes:
    name: Validações — versão e compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a regra "versão maior que a do ambiente" compara com a base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Versão (package.json = lock = compose, maior que a do ambiente, ainda não usada)
        env:
          COMPOSE: docker-compose.yml
          # PR: compara com a branch de destino; push: com o commit anterior
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: python3 .github/scripts/validate-version.py

      - name: Nomes do compose e gateway por ambiente
        run: |
          pip install --quiet pyyaml
          python3 .github/scripts/validate-compose.py \
            --repo "${{ github.event.repository.name }}" --env production \
            --exceptions .github/compose-exceptions.txt docker-compose.yml

  server:
    name: Servidor — tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # o mesmo da imagem Docker (node:24-alpine)
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      # [RECOMENDADO] começa como aviso; vira bloqueante quando o backlog zerar
      - name: Vulnerabilidades das dependências (aviso)
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev || { echo "::warning::npm audit (server) achou vulnerabilidade alta"; exit 1; }

  web:
    name: Web — tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
      - name: Vulnerabilidades das dependências (aviso)
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev || { echo "::warning::npm audit (web) achou vulnerabilidade alta"; exit 1; }

  imagem:
    name: Imagem Docker + smoke da stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: dev_reactjs_acesscontrol-ci
      ELASTIC_APM_SERVER_URL: '' # vazio = APM desligado; o CI não polui o APM de produção
      BACKEND_PORT: '3100'
      # no CI não há cliente OAuth nem Voalle: sobe sem login (só para o smoke do health)
      AUTH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem (a mesma que o Portainer vai buildar)
        run: docker compose -f docker-compose.yml build

      # --wait espera o healthcheck, o mesmo critério do Portainer
      - name: Subir a stack
        run: docker compose -f docker-compose.yml up -d --wait

      - name: Health responde UP com a versão do package.json
        run: |
          versao=$(node -p "require('./package.json').version")
          curl -fsS --retry 15 --retry-delay 3 --retry-connrefused \
            "http://localhost:${BACKEND_PORT}/api/v1/health" -o health.json
          grep -q '"status":"UP"' health.json && grep -q "\"version\":\"${versao}\"" health.json || {
            echo "::error::/api/v1/health devolveu resposta inesperada (esperado status UP e versão ${versao}):"; cat health.json; exit 1; }

      - name: A tela é servida
        run: |
          curl -fsS "http://localhost:${BACKEND_PORT}/" -o index.html
          grep -q '<div id="root">' index.html || { echo "::error::a página inicial não veio:"; head -c 500 index.html; exit 1; }

      - name: Logs da stack
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color --timestamps > compose-logs.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt

      - name: Derrubar a stack
        if: always()
        run: docker compose -f docker-compose.yml down -v

  # Check único da proteção de branch. `if: always()`: senão é pulado quando um `needs`
  # falha e nunca reporta.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [validacoes, server, web, imagem]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Resultado agregado
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::Pelo menos um job não passou."; exit 1
          fi
          echo "Tudo verde."
